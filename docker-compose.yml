# Development-only PostgreSQL service.
# Do not use these credentials for production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: car-dealership-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_dealership
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - car_dealership_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d car_dealership"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  car_dealership_pgdata:
